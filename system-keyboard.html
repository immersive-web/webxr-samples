<html>
  <head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1, user-scalable=no'>
    <meta name='mobile-web-app-capable' content='yes'>
    <meta name='apple-mobile-web-app-capable' content='yes'>
    <link rel='icon' type='image/png' sizes='32x32' href='favicon-32x32.png'>
    <link rel='icon' type='image/png' sizes='96x96' href='favicon-96x96.png'>
    <link rel='stylesheet' href='css/common.css'>

    <title>System Keyboard</title>
    <style>
      #keyboardInput {
        box-sizing: border-box;
        font: inherit;
        margin-top: 0.25rem;
        padding: 0.45rem;
        width: 100%;
      }

      #keyboardStatus {
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <details open>
        <summary>System Keyboard</summary>
        <p>
          This sample focuses a text input when either controller performs its
          primary action. If the XR device supports a system keyboard, the
          keyboard will be shown while the immersive session remains active.
          <a class="back" href="./">Back</a>
        </p>
        <label for='keyboardInput'>Text input</label>
        <input id='keyboardInput' type='text' inputmode='text'
               autocomplete='off' placeholder='Controller clicks focus here'>
        <p id='keyboardStatus' role='status'>Enter XR to check keyboard support.</p>
      </details>
    </header>
    <main style='text-align: center;'>
      <p>Click 'Enter XR' to see content</p>
    </main>
    <script type="module">
      import {WebXRButton} from './js/util/webxr-button.js';
      import {Scene} from './js/render/scenes/scene.js';
      import {Renderer, createWebGLContext} from './js/render/core/renderer.js';
      import {Gltf2Node} from './js/render/nodes/gltf2.js';
      import {SkyboxNode} from './js/render/nodes/skybox.js';
      import {QueryArgs} from './js/util/query-args.js';

      import WebXRPolyfill from './js/third-party/webxr-polyfill/build/webxr-polyfill.module.js';
      if (QueryArgs.getBool('usePolyfill', true)) {
        let polyfill = new WebXRPolyfill();
      }

      let xrButton = null;
      let xrRefSpace = null;

      let gl = null;
      let renderer = null;
      let scene = new Scene();
      scene.addNode(new Gltf2Node({url: 'media/gltf/space/space.gltf'}));
      scene.addNode(new SkyboxNode({url: 'media/textures/milky-way-4k.png'}));

      const keyboardInput = document.getElementById('keyboardInput');
      const keyboardStatus = document.getElementById('keyboardStatus');

      function setStatus(message) {
        keyboardStatus.textContent = message;
      }

      function initXR() {
        xrButton = new WebXRButton({
          onRequestSession,
          onEndSession
        });
        document.querySelector('header').appendChild(xrButton.domElement);

        if (!navigator.xr) {
          setStatus('WebXR is not available.');
          return;
        }

        navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
          xrButton.enabled = supported;
          if (!supported) {
            setStatus('Immersive VR is not supported.');
          }
        });
      }

      function onRequestSession() {
        return navigator.xr.requestSession('immersive-vr').then(onSessionStarted);
      }

      function onSessionStarted(session) {
        xrButton.setSession(session);
        session.addEventListener('end', onSessionEnded);
        session.addEventListener('select', onSelect);

        if (session.isSystemKeyboardSupported) {
          setStatus('System keyboard supported. Click either controller to show it.');
        } else {
          setStatus('This XR device does not support the system keyboard.');
        }

        gl = createWebGLContext({xrCompatible: true});
        renderer = new Renderer(gl);
        scene.setRenderer(renderer);

        session.updateRenderState({baseLayer: new XRWebGLLayer(session, gl)});

        session.requestReferenceSpace('local').then((refSpace) => {
          xrRefSpace = refSpace;
          session.requestAnimationFrame(onXRFrame);
        });
      }

      function onSelect(event) {
        if (!event.frame.session.isSystemKeyboardSupported) {
          setStatus('This XR device does not support the system keyboard.');
          return;
        }

        if (document.activeElement == keyboardInput) {
          keyboardInput.blur();
        }
        keyboardInput.focus();
      }

      function onEndSession(session) {
        session.end();
      }

      function onSessionEnded() {
        xrButton.setSession(null);
        keyboardInput.blur();
        xrRefSpace = null;
        renderer = null;
        setStatus('XR session ended.');
      }

      function onXRFrame(t, frame) {
        let session = frame.session;

        scene.startFrame();
        session.requestAnimationFrame(onXRFrame);

        let pose = frame.getViewerPose(xrRefSpace);
        if (pose) {
          let glLayer = session.renderState.baseLayer;
          gl.bindFramebuffer(gl.FRAMEBUFFER, glLayer.framebuffer);
          gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

          for (let view of pose.views) {
            let viewport = glLayer.getViewport(view);
            gl.viewport(viewport.x, viewport.y,
                        viewport.width, viewport.height);
            scene.draw(view.projectionMatrix, view.transform, view.eye);
          }
        }

        scene.endFrame();
      }

      initXR();
    </script>
  </body>
</html>
