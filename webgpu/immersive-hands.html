<html>

<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1, user-scalable=no'>
  <meta name='mobile-web-app-capable' content='yes'>
  <meta name='apple-mobile-web-app-capable' content='yes'>
  <link rel='icon' type='image/png' sizes='32x32' href='../favicon-32x32.png'>
  <link rel='icon' type='image/png' sizes='96x96' href='../favicon-96x96.png'>
  <link rel='stylesheet' href='../css/common.css'>

  <title>Immersive Session with hands (WebGPU)</title>
</head>

<body>
  <header>
    <details open>
      <summary>Immersive VR Session with hands (WebGPU)</summary>
      <p>
        This sample demonstrates a simple VR session that shows the user's hands
        and controllers using WebGPU rendering. Hands are represented by a set
        of cubes, with each cube representing a joint.
        <a class="back" href="./">Back</a>
      </p>
      <label><input type='checkbox' id='trackedSources' checked> Request tracked-sources</label>
    </details>
  </header>
  <main style='text-align: center;'>
    <p>Click 'Enter XR' to see content</p>
  </main>
  <script type="module">
    // This sample is an AI-assisted port of the equivalent WebGL sample, and may not represent WebGPU best practices.
    import {WebXRButton} from '../js/util/webxr-button.js';
    import {GPUScene} from '../js/render/scenes/scene-gpu.js';
    import {GPURenderer, createWebGPUContext} from '../js/render/core/renderer-gpu.js';
    import {Node} from '../js/render/core/node.js';
    import {Gltf2GPUNode} from '../js/render/nodes/gltf2-gpu.js';
    import {SkyboxGPUNode} from '../js/render/nodes/skybox-gpu.js';
    import {BoxBuilder} from '../js/render/geometry/box-builder.js';
    import {PbrGPUMaterial} from '../js/render/materials/pbr-gpu.js';
    import {mat4} from '../js/render/math/gl-matrix.js';

    import {fetchProfile} from 'https://cdn.jsdelivr.net/npm/@webxr-input-profiles/motion-controllers@1.0/dist/motion-controllers.module.js';

    const DEFAULT_PROFILES_PATH =
        'https://cdn.jsdelivr.net/npm/@webxr-input-profiles/assets@1.0/dist/profiles';
    const SOURCE_TYPES = ['input', 'tracked'];
    const HANDEDNESSES = ['left', 'right'];

    // XR globals.
    let xrButton = null;
    let xrRefSpace = null;
    let isAR = false;
    let radii = new Float32Array(25);
    let positions = new Float32Array(16*25);

    // WebGPU globals.
    let device = null;
    let renderer = null;
    let binding = null;
    let layer = null;

    // Per-source-type hand and controller visuals.
    let boxes = {};
    let indexFingerBoxes = {};
    const sourceStates = {
      input: new Map(),
      tracked: new Map(),
    };
    const activeIndexFingerBoxes = new Set();
    const defaultBoxColor = {r: 0.5, g: 0.5, b: 0.5};
    const leftBoxColor = {r: 1, g: 0, b: 1};
    const rightBoxColor = {r: 0, g: 1, b: 1};
    let interactionBox = null;
    let leftInteractionBox = null;
    let rightInteractionBox = null;

    // Scene globals.
    let scene = new GPUScene();
    scene.addNode(new Gltf2GPUNode({url: '../media/gltf/space/space.gltf'}));
    scene.addNode(new SkyboxGPUNode({url: '../media/textures/milky-way-4k.png'}));
    scene.enableStats(true);
    scene.standingStats(true);

    function createBoxPrimitive(r, g, b) {
      let boxBuilder = new BoxBuilder();
      boxBuilder.pushCube([0, 0, 0], 1);
      let boxPrimitive = boxBuilder.finishPrimitiveGPU(renderer);
      let boxMaterial = new PbrGPUMaterial();
      boxMaterial.baseColorFactor.value = [r, g, b, 1];
      boxMaterial.metallicRoughnessFactor.value = [0.0, 0.8];
      return renderer.createRenderPrimitive(boxPrimitive, boxMaterial);
    }

    function addBox(x, y, z, r, g, b, offset) {
      let boxRenderPrimitive = createBoxPrimitive(r, g, b);
      let boxNode = new Node();
      boxNode.addRenderPrimitive(boxRenderPrimitive);
      boxNode.selectable = true;
      return boxNode;
    }

    function handKey(type, handedness) {
      return `${type}_${handedness}`;
    }

    function removeHandVisuals(key) {
      for (const box of boxes[key] || []) {
        scene.removeNode(box);
      }
      if (indexFingerBoxes[key]) {
        scene.removeNode(indexFingerBoxes[key]);
      }
      activeIndexFingerBoxes.delete(key);
    }

    function initHands() {
      for (const key of Object.keys(boxes)) {
        removeHandVisuals(key);
      }

      boxes = {};
      indexFingerBoxes = {};
      activeIndexFingerBoxes.clear();

      if (typeof XRHand === 'undefined') {
        return;
      }

      for (const type of SOURCE_TYPES) {
        for (const handedness of HANDEDNESSES) {
          const key = handKey(type, handedness);
          boxes[key] = [];
          for (let i = 0; i < 25; i++) {
            const r = .6 + Math.random() * .4;
            const g = .6 + Math.random() * .4;
            const b = .6 + Math.random() * .4;
            boxes[key].push(addBox(0, 0, 0, r, g, b));
          }

          const color = handedness === 'left' ?
              leftBoxColor : rightBoxColor;
          indexFingerBoxes[key] =
              addBox(0, 0, 0, color.r, color.g, color.b);
        }
      }
    }

    function ensureSourceState(inputSource, type) {
      const states = sourceStates[type];
      let state = states.get(inputSource);
      if (!state) {
        state = {
          controllerNode: null,
          profileRequested: false,
        };
        states.set(inputSource, state);
      }

      if (inputSource.hand || !inputSource.gripSpace ||
          state.profileRequested) {
        return state;
      }

      state.profileRequested = true;
      fetchProfile(inputSource, DEFAULT_PROFILES_PATH)
          .then(({assetPath}) => {
            if (states.get(inputSource) !== state) {
              return;
            }

            const controllerNode = new Gltf2GPUNode({url: assetPath});
            controllerNode.visible = false;
            state.controllerNode = controllerNode;
            scene.addNode(controllerNode);
          })
          .catch((error) => {
            if (states.get(inputSource) === state) {
              console.warn('Unable to load controller model.', error);
            }
          });

      return state;
    }

    function removeSourceState(inputSource, type) {
      const states = sourceStates[type];
      const state = states.get(inputSource);
      if (state?.controllerNode) {
        scene.removeNode(state.controllerNode);
      }
      states.delete(inputSource);

      if (!inputSource.hand) {
        return;
      }

      const key = handKey(type, inputSource.handedness);
      const hasReplacement = Array.from(states.keys()).some((source) =>
        source.hand && handKey(type, source.handedness) === key);
      if (!hasReplacement) {
        removeHandVisuals(key);
      }
    }

    function hideSourceVisuals(type) {
      for (const handedness of HANDEDNESSES) {
        removeHandVisuals(handKey(type, handedness));
      }
      for (const state of sourceStates[type].values()) {
        if (state.controllerNode) {
          state.controllerNode.visible = false;
        }
      }
    }

    function hideAllSourceVisuals() {
      for (const type of SOURCE_TYPES) {
        hideSourceVisuals(type);
      }
    }

    function clearSourceStates() {
      hideAllSourceVisuals();
      for (const type of SOURCE_TYPES) {
        for (const inputSource of Array.from(sourceStates[type].keys())) {
          removeSourceState(inputSource, type);
        }
      }
    }

    async function initXR() {
      if (!navigator.gpu) {
        console.error('WebGPU is not supported.');
        return;
      }

      // Initialize WebGPU device early.
      device = await createWebGPUContext({xrCompatible: true});
      if (!device) {
        return;
      }

      xrButton = new WebXRButton({
        onRequestSession: onRequestSession,
        onEndSession: onEndSession
      });
      document.querySelector('header').appendChild(xrButton.domElement);

      if (navigator.xr) {
        navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
          if (supported)
            xrButton.enabled = supported;
          else
            navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
              isAR = true;
              xrButton.enabled = supported;
            });
        });
      }
    }

    function onRequestSession() {
      let optionalFeatures = ['local-floor', 'bounded-floor', 'hand-tracking'];
      if (document.getElementById('trackedSources').checked) {
        optionalFeatures.push('tracked-sources');
      }
      return navigator.xr.requestSession(isAR ? 'immersive-ar' : 'immersive-vr', {
        requiredFeatures: ['webgpu'],
        optionalFeatures,
      }).then(onSessionStarted);
    }

    function onSessionStarted(session) {
      xrButton.setSession(session);

      session.addEventListener('end', onSessionEnded);

      // Create the XRGPUBinding.
      binding = new XRGPUBinding(session, device);

      let colorFormat = binding.getPreferredColorFormat();

      layer = binding.createProjectionLayer({
        colorFormat: colorFormat,
        depthStencilFormat: 'depth24plus',
      });

      session.updateRenderState({ layers: [layer] });

      renderer = new GPURenderer(device, colorFormat);

      clearSourceStates();
      initHands();

      scene.setRenderer(renderer);

      session.addEventListener('inputsourceschange', onInputSourcesChange);
      session.addEventListener('trackedsourceschange', onTrackedSourcesChange);
      session.addEventListener('visibilitychange', (event) => {
        if (event.session.visibilityState !== 'visible') {
          hideAllSourceVisuals();
        }
      });

      session.requestReferenceSpace('local').then((refSpace) => {
        xrRefSpace = refSpace.getOffsetReferenceSpace(new XRRigidTransform({ x: 0, y: 0, z: 0 }));
        session.requestAnimationFrame(onXRFrame);
      });
    }

    function onEndSession(session) {
      session.end();
    }

    function onSessionEnded(event) {
      xrButton.setSession(null);
      clearSourceStates();
      xrRefSpace = null;
      binding = null;
      layer = null;
      renderer = null;
    }

    function onInputSourcesChange(event) {
      onSourcesChange(event, 'input');
    }

    function onTrackedSourcesChange(event) {
      onSourcesChange(event, 'tracked');
    }

    function onSourcesChange(event, type) {
      for (const inputSource of event.removed) {
        removeSourceState(inputSource, type);
      }
      for (const inputSource of event.added) {
        ensureSourceState(inputSource, type);
      }
    }

    function updateInputSources(session, frame, refSpace) {
      updateSources(session, frame, refSpace, session.inputSources, 'input');
    }

    function updateTrackedSources(session, frame, refSpace) {
      updateSources(
          session, frame, refSpace, session.trackedSources || [], 'tracked');
    }

    function updateControllerSource(inputSource, state, frame, refSpace) {
      if (!state.controllerNode || !inputSource.gripSpace) {
        return;
      }

      const gripPose = frame.getPose(inputSource.gripSpace, refSpace);
      if (gripPose) {
        state.controllerNode.matrix = gripPose.transform.matrix;
        state.controllerNode.visible = true;
      }
    }

    function updateHandSource(inputSource, type, frame, refSpace) {
      const key = handKey(type, inputSource.handedness);
      const handBoxes = boxes[key];
      const indexFingerBox = indexFingerBoxes[key];
      if (!handBoxes || !indexFingerBox ||
          !frame.fillJointRadii(inputSource.hand.values(), radii) ||
          !frame.fillPoses(inputSource.hand.values(), refSpace, positions)) {
        removeHandVisuals(key);
        return false;
      }

      for (let i = 0; i < handBoxes.length; i++) {
        const box = handBoxes[i];
        const matrix = positions.subarray(i * 16, (i + 1) * 16);
        const jointRadius = radii[i];
        scene.addNode(box);
        mat4.getTranslation(box.translation, matrix);
        mat4.getRotation(box.rotation, matrix);
        box.scale = [jointRadius, jointRadius, jointRadius];
      }

      const joint = inputSource.hand.get('index-finger-tip');
      const jointPose = joint ? frame.getJointPose(joint, refSpace) : null;
      if (!jointPose) {
        scene.removeNode(indexFingerBox);
        activeIndexFingerBoxes.delete(key);
        return true;
      }

      scene.addNode(indexFingerBox);
      mat4.getTranslation(
          indexFingerBox.translation, jointPose.transform.matrix);
      mat4.getRotation(indexFingerBox.rotation, jointPose.transform.matrix);
      indexFingerBox.scale = [0.02, 0.02, 0.02];
      activeIndexFingerBoxes.add(key);
      return true;
    }

    function updateSources(session, frame, refSpace, sources, type) {
      const sourceList = Array.from(sources);
      const currentSources = new Set(sourceList);
      const states = sourceStates[type];

      for (const inputSource of Array.from(states.keys())) {
        if (!currentSources.has(inputSource)) {
          removeSourceState(inputSource, type);
        }
      }
      for (const state of states.values()) {
        if (state.controllerNode) {
          state.controllerNode.visible = false;
        }
      }

      if (session.visibilityState !== 'visible') {
        hideSourceVisuals(type);
        return;
      }

      const activeHands = new Set();
      for (const inputSource of sourceList) {
        const state = ensureSourceState(inputSource, type);
        if (!inputSource.hand) {
          updateControllerSource(inputSource, state, frame, refSpace);
          continue;
        }

        if (updateHandSource(inputSource, type, frame, refSpace)) {
          activeHands.add(handKey(type, inputSource.handedness));
        }
      }

      for (const handedness of HANDEDNESSES) {
        const key = handKey(type, handedness);
        if (!activeHands.has(key)) {
          removeHandVisuals(key);
        }
      }
    }

    function UpdateInteractables(time) {
      if (!interactionBox) {
        function AddInteractionBox(r, g, b) {
          let box = new Node();
          box.addRenderPrimitive(createBoxPrimitive(r, g, b));
          box.translation = [0, -0.3, -0.65];
          box.scale = [0.25, 0.25, 0.25];
          return box;
        }
        interactionBox = AddInteractionBox(defaultBoxColor.r, defaultBoxColor.g, defaultBoxColor.b);
        leftInteractionBox = AddInteractionBox(leftBoxColor.r, leftBoxColor.g, leftBoxColor.b);
        rightInteractionBox = AddInteractionBox(rightBoxColor.r, rightBoxColor.g, rightBoxColor.b);
        scene.addNode(interactionBox);
        scene.addNode(leftInteractionBox);
        scene.addNode(rightInteractionBox);
      }

      function Distance(nodeA, nodeB) {
        return Math.sqrt(
          Math.pow(nodeA.translation[0] - nodeB.translation[0], 2) +
          Math.pow(nodeA.translation[1] - nodeB.translation[1], 2) +
          Math.pow(nodeA.translation[2] - nodeB.translation[2], 2));
      }

      const interactionDistance = interactionBox.scale[0];
      leftInteractionBox.visible = false;
      rightInteractionBox.visible = false;

      function IsHandTouching(handedness) {
        return SOURCE_TYPES.some((type) => {
          const key = handKey(type, handedness);
          return activeIndexFingerBoxes.has(key) &&
              Distance(indexFingerBoxes[key], interactionBox) <
                  interactionDistance;
        });
      }

      if (IsHandTouching('left')) {
        leftInteractionBox.visible = true;
      } else if (IsHandTouching('right')) {
        rightInteractionBox.visible = true;
      }
      interactionBox.visible = !(leftInteractionBox.visible || rightInteractionBox.visible);

      mat4.rotateX(interactionBox.matrix, interactionBox.matrix, time/1000);
      mat4.rotateY(interactionBox.matrix, interactionBox.matrix, time/1500);
      leftInteractionBox.matrix = interactionBox.matrix;
      rightInteractionBox.matrix = interactionBox.matrix;
    }

    function onXRFrame(t, frame) {
      let session = frame.session;

      scene.startFrame();

      session.requestAnimationFrame(onXRFrame);

      activeIndexFingerBoxes.clear();
      updateInputSources(session, frame, xrRefSpace);
      updateTrackedSources(session, frame, xrRefSpace);
      UpdateInteractables(t);

      let pose = frame.getViewerPose(xrRefSpace);

      if (pose) {
        scene.drawXRFrame(frame, pose, binding, layer);
      }

      scene.endFrame();
    }

    // Start the XR application.
    initXR();
  </script>
</body>

</html>
